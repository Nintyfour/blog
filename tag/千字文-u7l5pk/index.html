      <h2 class="post-card__title">以共产主义为例，浅论实践与真理的关系</h2>
      <p class="post-card__excerpt">本文旨在驳斥吴冷西，汪东兴等人对于《实践是检验真理的唯一标准》的无理批判。虽说早已有无数前人替我批判过这一观点，但我仍想锻炼自己的论述能力，写一篇千字文，尽量在千字左右讲清楚我对这个问题的看法。</p>
